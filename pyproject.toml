[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keystones"
version = "0.1.0"
description = "Force SME review of load-bearing code by pinning a review gate to an AST node"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kyle James Walker" }]
keywords = ["pre-commit", "code-review", "codeowners", "ast", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KyleJamesWalker/keystones"
Issues = "https://github.com/KyleJamesWalker/keystones/issues"

[project.scripts]
keystones = "keystones.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/keystones"]

# Pins the public index so the ambient UV_INDEX_URL / PIP_INDEX_URL cannot reach
# a lockfile. Removing this leaks an internal mirror host into uv.lock.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.keystones]
root = "keystones"
exclude = ["tests/fixtures/**"]
categories = ["default", "hasher"]
